<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M10MSC9BG2"></script>
<!-- The inline config snippet lives in assets/gtag-init.js so the CSP in
     _headers can stay script-src 'self' with no inline-script hash. -->
<script src="/assets/gtag-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimplifiedCS</title>

<link rel="canonical" href="https://simplifiedcs.net/">
<!-- Open Graph / link-preview bots (LinkedIn, Slack, WhatsApp, iMessage,
     Facebook, ...) never execute JavaScript, so these static tags are the
     only thing they ever see - without them a shared link previews with no
     title/description/image at all. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="SimplifiedCS">
<meta property="og:title" content="SimplifiedCS - Cybersecurity Posture Assessment, Made Simple">
<meta property="og:description" content="A free, adaptive cybersecurity self-assessment for small and medium businesses - scored, prioritized, and mapped to real frameworks like NIST CSF 2.0 and CIS Controls.">
<meta property="og:url" content="https://simplifiedcs.net/">
<meta property="og:image" content="https://simplifiedcs.net/assets/social-preview.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="SimplifiedCS - Cybersecurity Posture Assessment, Made Simple">
<meta name="twitter:description" content="A free, adaptive cybersecurity self-assessment for small and medium businesses - scored, prioritized, and mapped to real frameworks like NIST CSF 2.0 and CIS Controls.">
<meta name="twitter:image" content="https://simplifiedcs.net/assets/social-preview.png">
<!-- Real files, not an inline base64 data URI - regenerated from the current
     masthead icon (assets/social-preview.png's own source; the old inline
     favicon had drifted to an earlier logo design entirely, disconnected
     from the live header - FAVICON-UPDATE-BRIEF.md). Real files rather than
     inline base64 deliberately: prerendering now produces ~20 static pages
     that all share this same head, so an inline blob here would duplicate
     it ~20x the same way the JS bundle would have if left inline (see
     scripts/prerender.js's externalizeBundle()) - a real file is fetched
     and cached once instead. -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
