# Checks every push and pull request. Uses no repository secrets and makes
# no paid API calls: the AI endpoint tests use in-memory fakes, and the
# Supabase policy tests run against an in-process PGlite database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # This job skips Puppeteer's browser download; the accessibility job
      # below is the one that needs it.
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Tests
        run: npm test

      # The built files are committed (Netlify serves them as-is), so check
      # they match what the sources produce. Hashed names mean any source
      # change without a rebuild shows up as a missing or extra file.
      - name: Build is reproducible
        run: |
          npm run build
          git status --porcelain -- assets/build
          test -z "$(git status --porcelain -- assets/build)" || { echo "::error::assets/build doesn't match the sources - run npm run build and commit the result"; exit 1; }

      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  # Runs the committed site in headless Chrome and checks every page and
  # assessment state against WCAG 2.2 A/AA with axe-core, in both themes
  # (scripts/a11y-audit.js). The News and Exploit pages read the public
  # Supabase feeds, as a visitor's browser would.
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (including Puppeteer's browser)
        run: npm ci

      # Ubuntu 23.10+ restricts the user namespaces Chrome's sandbox needs.
      # Puppeteer's documented CI fix is to lift that restriction on the
      # runner, which keeps the browser sandbox on.
      - name: Allow Chrome's sandbox on the runner
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Accessibility audit
        run: npm run a11y
