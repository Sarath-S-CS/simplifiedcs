name: Keep Supabase Project Alive

on:
  schedule:
    - cron: '0 8 * * *'  # Runs daily at 08:00 UTC
  workflow_dispatch:      # Lets you also trigger it manually from the Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: "Query the keepalive table (anon key, real table - not the restricted schema root)"
        run: |
          curl --fail -s -w "\nPing response: %{http_code}\n" \
            "https://xufqgrcxufptlptpwlfi.supabase.co/rest/v1/keepalive?select=id&limit=1" \
