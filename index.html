    --hero-scrim: linear-gradient(100deg, rgba(0,0,0,0.35), rgba(0,0,0,0));
    --line:#243B2C;
    --text:#E6F3EA;
    --text-muted:#6FA083;
    --accent-signal:#01A982;
    --accent-secure:#017F63;
    --accent-critical:#D6685F;
    --accent-violet:#B48EC7;
    --accent-amber:#E0A94A;
    --accent-pop:#FF5FA2;
    --text-on-accent:#04140A;
    --tint-signal: rgba(1,169,130,0.14);
    --tint-signal-soft: rgba(1,169,130,0.08);
    --tint-signal-strong: rgba(1,169,130,0.22);
    --tint-secure: rgba(1,127,99,0.14);
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  html[data-theme="light"]{
    --bg:#FFFFFF;
    --surface:#F5F9F6;
    --surface-raised:#EAF2EC;
    --tile-bg: #F5F9F6;
    --hero-wallpaper: none;
    --hero-scrim: none;
    --line:#D2E1D7;
    --text:#132018;
    --text-muted:#5C7266;
    --accent-signal:#01A982;
    --accent-secure:#017F63;
    --accent-critical:#B5443C;
    --accent-violet:#7C5B93;
    --accent-amber:#A8710A;
    --accent-pop:#C9186B;
    --text-on-accent:#04140A;
    --tint-signal: rgba(1,169,130,0.12);
    --tint-signal-soft: rgba(1,169,130,0.07);
    --tint-signal-strong: rgba(1,169,130,0.20);
    --tint-secure: rgba(1,127,99,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    line-height:1.5;
    transition:background-color .2s ease, color .2s ease;
  }
  *{ transition:background-color .15s ease, border-color .15s ease, color .15s ease; }
  .app{
    max-width:1080px;
    margin:0 auto;
    padding:40px 24px 80px;
  }
  .masthead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
    margin-bottom:32px;
    flex-wrap:wrap;
  }
  .masthead-brand{ flex-shrink:0; text-decoration:none; display:block; }
  .masthead-right{ display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  .masthead .eyebrow{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.12em;
    color:var(--text-muted);
    text-transform:uppercase;
  }
  .masthead h1{
    font-family:var(--mono);
    font-size:21px;
    font-weight:600;
    margin:4px 0 0;
    letter-spacing:0.06em;
  }
  .brand-s{ color:var(--accent-signal); }
  .brand-mid{ color:var(--text); }
  .brand-cs{ color:var(--accent-critical); }
  .theme-toggle{
    display:flex; align-items:center; gap:7px; flex-shrink:0;
    background:transparent; border:1px solid var(--line); color:var(--text-muted);
    padding:8px 12px; cursor:pointer; font-family:var(--mono); font-size:10.5px;
    letter-spacing:0.05em; text-transform:uppercase;
  }
  .theme-toggle:hover{ border-color:var(--accent-signal); color:var(--accent-signal); }
  .theme-toggle svg{ width:13px; height:13px; }
  .assessment-serial{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-muted);
    margin-bottom:20px;
  }
  .layout{
    display:grid;
    grid-template-columns:180px 1fr;
    gap:40px;
  }
  @media (max-width:720px){
    .layout{grid-template-columns:1fr;}
    .rail{display:flex; flex-direction:row; gap:0; margin-bottom:24px;}
  }

  /* --- tab navigation --- */
  .tabnav{
    display:flex;
    gap:4px;
    align-items:center;
    flex-wrap:wrap;
  }
  .tab-item{ position:relative; display:flex; }
  .tab-btn{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--text-muted);
    background:transparent;
    border:none;
    padding:11px 16px;
    cursor:pointer;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tab-btn:hover{ color:var(--accent-signal); background:var(--tint-signal-soft); }
  .tab-btn.active{ background:var(--accent-signal); color:var(--text-on-accent); }
  .tab-caret{ font-size:9px; opacity:0.8; padding:4px; margin:-4px; }
  .tab-dropdown{
    position:absolute;
    top:100%;
    left:0;
    min-width:190px;
    background:var(--surface-raised);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    opacity:0;
    visibility:hidden;
    transform:translateY(-4px);
    transition:opacity .15s ease, transform .15s ease, visibility .15s ease;
    z-index:20;
    max-height:70vh;
    overflow-y:auto;
  }
  .tab-item.has-dropdown:hover .tab-dropdown,
  .tab-item.has-dropdown:focus-within .tab-dropdown,
  .tab-item.has-dropdown.open .tab-dropdown{
    opacity:1; visibility:visible; transform:translateY(0);
  }
  .dropdown-link{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:0.03em;
    color:var(--text-muted);
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    padding:11px 14px;
    text-align:left;
    cursor:pointer;
  }
  .dropdown-link:last-child{ border-bottom:none; }
  .dropdown-link:hover{ color:var(--accent-signal); background:var(--tint-signal-soft); }
  .dropdown-link.active{ color:var(--accent-signal); }

  /* --- rail / schematic trace --- */
  .rail{
    position:relative;
    padding-left:4px;
  }
  .rail-line{
    position:absolute;
    left:11px;
    top:10px;
    bottom:10px;
    width:1px;
    background:var(--line);
  }
  .node{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 0;
    cursor:default;
  }
  .node .dot{
    width:9px;
    height:9px;
    border:1.5px solid var(--text-muted);
    background:var(--bg);
    transform:rotate(45deg);
    flex-shrink:0;
    z-index:1;
    transition:all .3s ease;
  }
  .node.done .dot{ background:var(--accent-secure); border-color:var(--accent-secure); }
  .node.active .dot{ background:var(--accent-signal); border-color:var(--accent-signal); box-shadow:0 0 0 4px var(--tint-signal-strong); }
  .node .label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--text-muted);
    text-transform:uppercase;
  }
  .node.active .label{ color:var(--text); }
  .node.done .label{ color:var(--text-muted); }

  /* --- main panel --- */
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    padding:32px;
    min-height:420px;
    display:flex;
    flex-direction:column;
  }
  .step-eyebrow{
    font-family:var(--mono);
    font-size:11px;
    color:var(--accent-signal);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .step-title{
    font-size:24px;
    font-weight:600;
    margin:0 0 6px;
  }
  .step-sub{
    color:var(--text-muted);
    font-size:14px;
    margin:0 0 28px;
  }
  .question{
    margin-bottom:28px;
  }
  .question:last-child{margin-bottom:0;}
  .question p{
    font-size:15px;
    margin:0 0 12px;
    font-weight:500;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .option{
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid var(--line);
    background:var(--surface-raised);
    padding:12px 14px;
    cursor:pointer;
    font-size:14px;
    transition:border-color .15s ease, background .15s ease;
  }
  .option:hover{ border-color:var(--accent-signal); }
  .option.selected{
    border-color:var(--accent-secure);
    background:var(--tint-secure);
  }
  .option .radio{
    width:14px;height:14px;border:1.5px solid var(--text-muted);border-radius:50%;
    flex-shrink:0; position:relative;
  }
  .option.selected .radio{ border-color:var(--accent-secure); }
  .option.selected .radio::after{
    content:''; position:absolute; inset:2.5px; background:var(--accent-secure); border-radius:50%;
  }
  .nav{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-top:32px;
    padding-top:24px;
    border-top:1px solid var(--line);
  }
  button{
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    padding:11px 22px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
  }
  button.primary{
    background:var(--accent-signal);
    border-color:var(--accent-signal);
    color:var(--text-on-accent);
  }
  button.primary:hover{ filter:brightness(1.08); }
  button:not(.primary):hover{ border-color:var(--accent-signal); }
  button:disabled{ opacity:0.35; cursor:not-allowed; }

  /* --- results --- */
  .results{ display:none; }
  .results.show{ display:block; }
  .gauge-row{
    display:grid;
    grid-template-columns:200px 1fr;
    gap:36px;
    align-items:center;
    margin-bottom:36px;
  }
  .gauge{
    width:180px;height:180px;border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .gauge::before{
    content:'';
    position:absolute; inset:14px;
    background:var(--surface);
    border-radius:50%;
  }
  .gauge-inner{
    position:relative; z-index:1; text-align:center;
  }
  .gauge-inner .pct{
    font-family:var(--mono); font-size:32px; font-weight:600;
  }
  .gauge-inner .verdict{
    font-family:var(--mono); font-size:10px; letter-spacing:0.08em;
    color:var(--text-muted); text-transform:uppercase; margin-top:4px;
  }
  .func-bars{ display:flex; flex-direction:column; gap:10px; }
  .func-bar-row{ display:grid; grid-template-columns:90px 1fr 40px; align-items:center; gap:12px; font-size:12px; }
  .func-bar-row .fname{ font-family:var(--mono); color:var(--text-muted); letter-spacing:0.04em; }
  .func-bar-track{ height:6px; background:var(--surface-raised); position:relative; }
  .func-bar-fill{ height:100%; transition:width .6s ease; }
  .func-bar-row .fpct{ font-family:var(--mono); text-align:right; color:var(--text-muted); }

  .flags{ margin-bottom:28px; }
  .flags h3, .priorities h3, .snapshot h3{
    font-family:var(--mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-muted); margin:0 0 14px; font-weight:500;
  }
  .flag-item{
    border-left:2px solid var(--accent-critical);
    background:rgba(214,104,95,0.06);
    padding:12px 16px; margin-bottom:10px; font-size:13.5px;
  }
  .flag-item b{ color:var(--accent-critical); }
  .vendor-note-item{
    border-left:2px solid var(--accent-signal);
    background:var(--tint-signal-soft);
    padding:12px 16px; margin-bottom:10px; font-size:13.5px;
  }
  .vendor-note-item b{ color:var(--accent-signal); }
  .priority-item{
    display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .priority-item:last-child{ border-bottom:none; }
  .priority-rank{
    font-family:var(--mono); color:var(--accent-signal); font-weight:600; flex-shrink:0; width:20px;
  }
  .note-box{
    margin-top:32px; padding:16px 18px; border:1px dashed var(--line);
    font-size:12.5px; color:var(--text-muted); font-family:var(--mono); line-height:1.6;
  }
  .note-box b{ color:var(--text); }

  /* --- scope screen --- */
  .industry-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:32px;
  }
  @media (max-width:560px){ .industry-grid{ grid-template-columns:1fr; } }
  .industry-card{
    border:1px solid var(--line);
    background:var(--surface-raised);
    padding:12px 14px;
    font-size:13.5px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .industry-card:hover{ border-color:var(--accent-signal); }
  .industry-card.selected{
    border-color:var(--accent-signal);
    background:var(--tint-signal);
  }
  .fw-section-label{
    font-family:var(--mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-muted); margin:0 0 12px; font-weight:500;
  }
  .fw-baseline{
    border:1px solid var(--line);
    background:var(--surface-raised);
    padding:12px 14px;
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:16px;
  }
  .fw-baseline b{ color:var(--text); }
  .fw-card{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    border:1px solid var(--line);
    background:var(--surface-raised);
    padding:14px 16px;
    margin-bottom:8px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .fw-card:hover{ border-color:var(--accent-signal); }
  .fw-card.selected{
    border-color:var(--accent-secure);
    background:var(--tint-secure);
  }
  .fw-card .fw-name{ font-weight:600; font-size:14px; margin-bottom:4px; }
  .fw-card .fw-desc{ font-size:12.5px; color:var(--text-muted); }
  .fw-card .checkbox{
    width:16px; height:16px; border:1.5px solid var(--text-muted); flex-shrink:0; position:relative; margin-top:2px;
  }
  .fw-card.selected .checkbox{ border-color:var(--accent-secure); background:var(--accent-secure); }
  .fw-card.selected .checkbox::after{
    content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:var(--text-on-accent); font-weight:700;
  }
  .fw-badge{
    display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--accent-signal); border:1px solid var(--accent-signal);
    padding:2px 6px; margin-left:8px; vertical-align:middle;
  }
  .recommended-tag{
    font-family:var(--mono); font-size:9.5px; color:var(--accent-secure); letter-spacing:0.05em; text-transform:uppercase;
  }
  .q-badge{
    display:inline-block; font-family:var(--mono); font-size:9px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--text-muted); border:1px solid var(--line);
    padding:2px 5px; margin-left:8px; vertical-align:middle;
  }
  .scope-hint{ font-size:12.5px; color:var(--text-muted); margin:-8px 0 20px; }

  /* --- pre-assessment fields --- */
  .field{ margin-bottom:20px; }
  .field label{ display:block; font-size:13.5px; font-weight:500; margin-bottom:8px; }
  .opt-tag{ font-family:var(--mono); font-size:9.5px; color:var(--text-muted); font-weight:400; text-transform:uppercase; letter-spacing:0.05em; }
  .field select, .field input[type=text]{
    width:100%; background:var(--surface-raised); border:1px solid var(--line); color:var(--text);
    font-family:var(--sans); font-size:14px; padding:11px 12px;
  }
  .field select:focus, .field input[type=text]:focus{ outline:none; border-color:var(--accent-secure); }
  .field input[type=text]::placeholder{ color:var(--text-muted); }

  /* --- infrastructure snapshot --- */
  .snapshot{ margin-bottom:28px; }
  .snapshot-row{ display:grid; grid-template-columns:180px 1fr; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .snapshot-row:last-child{ border-bottom:none; }
  .snapshot-row .skey{ font-family:var(--mono); color:var(--text-muted); letter-spacing:0.03em; }

  .info-box{
    border:1px solid var(--line); background:var(--surface-raised); padding:14px 16px;
    font-size:13px; color:var(--text-muted); margin-bottom:22px; line-height:1.6;
  }
  .info-box b{ color:var(--text); }
  .ot-skip-note{
    font-size:12.5px; color:var(--text-muted); margin:-16px 0 24px; padding:12px 14px;
    border:1px dashed var(--line); line-height:1.6;
  }
  .ot-skip-note b{ color:var(--text); }
  .ot-override-label{
    display:flex; align-items:center; gap:8px; margin-top:10px; cursor:pointer;
    font-family:var(--mono); font-size:11px; letter-spacing:0.03em; color:var(--accent-secure);
  }
  .ot-override-label input{ cursor:pointer; }

  .history-link{ font-size:12.5px; color:var(--accent-secure); margin:-16px 0 24px; cursor:pointer; }
  .history-list{ margin:20px 0 8px; }
  .history-row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .history-row:last-child{ border-bottom:none; }
  .history-score{ font-family:var(--mono); color:var(--accent-secure); font-weight:600; }
  .trend-chart{ width:100%; height:auto; margin-bottom:24px; display:block; }
  .delta-box{ border:1px solid var(--line); background:var(--surface-raised); padding:16px 18px; margin-bottom:28px; }
  .delta-box h3{ font-family:var(--mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); margin:0 0 10px; font-weight:500; }
  .delta-score{ font-family:var(--mono); font-size:20px; font-weight:600; margin-bottom:8px; }
  .delta-score.up{ color:var(--accent-secure); }
  .delta-score.down{ color:var(--accent-critical); }
  .delta-resolved{ font-size:13px; color:var(--accent-secure); margin-bottom:4px; }
  .delta-resolved b{ color:var(--accent-secure); }
  .delta-new{ font-size:13px; color:var(--accent-signal); }
  .delta-new b{ color:var(--accent-signal); }

  /* --- content pages (Home / Methodology / Maturity / News) --- */
  .page{ display:flex; flex-direction:column; gap:20px; }
  .page-intro{ background:var(--tile-bg); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); padding:32px 36px; }
  @media (max-width:720px){ .page-intro{ padding:22px 20px; } }
  .section-tile{ background:var(--tile-bg); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); padding:32px 36px; }
  @media (max-width:720px){ .section-tile{ padding:22px 20px; } }
  .section-tile .section-h:first-child{ margin-top:0; }

  /* --- scroll-reveal + tab transitions --- */
  .section-tile, .page-intro{
    opacity:0;
    transform:translateY(18px);
    transition:opacity .55s ease, transform .55s ease;
  }
  .section-tile.revealed, .page-intro.revealed{
    opacity:1;
    transform:translateY(0);
  }
  #tabContent{ transition:opacity .18s ease, transform .18s ease; }
  #tabContent.tab-fade{ opacity:0; transform:translateY(10px); }
  @media (prefers-reduced-motion: reduce){
    .section-tile, .page-intro{ opacity:1; transform:none; transition:none; }
    #tabContent{ transition:none; }
  }

  .page-eyebrow{
    font-family:var(--mono); font-size:11px; color:var(--accent-signal);
    letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px;
  }
  .page h2.page-title{ font-size:30px; font-weight:600; margin:0 0 14px; line-height:1.15; }
  .page .page-lede{ color:var(--text-muted); font-size:15.5px; max-width:640px; margin:0 0 32px; line-height:1.6; }
  .page h3.section-h{ font-size:16px; font-weight:600; margin:36px 0 14px; }
  .page h3.section-h:first-of-type{ margin-top:0; }
  .page p.body-text{ font-size:14px; color:var(--text-muted); line-height:1.7; max-width:680px; margin:0 0 14px; }
  .page p.body-text b{ color:var(--text); }

  .cta-row{ display:flex; gap:12px; margin-top:28px; flex-wrap:wrap; }
  .cta-btn{
    font-family:var(--sans); font-size:14px; font-weight:600; padding:13px 26px;
    border:1px solid var(--accent-signal); background:var(--accent-signal); color:var(--text-on-accent); cursor:pointer;
  }
  .cta-btn:hover{ filter:brightness(1.08); }
  .cta-btn.secondary{ background:transparent; color:var(--text); border-color:var(--line); }
  .cta-btn.secondary:hover{ border-color:var(--accent-signal); color:var(--accent-signal); }

  .value-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); margin:24px 0 36px; }
  @media (max-width:720px){ .value-grid{ grid-template-columns:1fr; } }
  .value-card{ background:var(--surface); padding:22px; }
  .value-card .vnum{ font-family:var(--mono); color:var(--accent-signal); font-size:12px; margin-bottom:10px; }
  .value-card h4{ font-size:14.5px; margin:0 0 8px; }
  .value-card p{ font-size:13px; color:var(--text-muted); line-height:1.6; margin:0; }

  .func-legend{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px 24px; margin:20px 0 32px; }
  @media (max-width:640px){ .func-legend{ grid-template-columns:1fr; } }
  .func-legend-row{ display:flex; gap:12px; align-items:flex-start; font-size:13px; }
  .func-legend-dot{ width:10px; height:10px; margin-top:4px; flex-shrink:0; transform:rotate(45deg); }
  .func-legend-row b{ display:block; margin-bottom:2px; font-size:13.5px; }
  .func-legend-row span{ color:var(--text-muted); }

  .verdict-scale{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); margin:20px 0 32px; }
  @media (max-width:640px){ .verdict-scale{ grid-template-columns:1fr; } }
  .verdict-cell{ background:var(--surface); padding:16px; text-align:center; }
  .verdict-cell .vrange{ font-family:var(--mono); font-size:11px; color:var(--text-muted); margin-bottom:6px; }
  .verdict-cell .vlabel{ font-size:13.5px; font-weight:600; }

  .tier-track{ position:relative; margin:24px 0 36px; padding-left:4px; }
  .tier-row{ display:flex; gap:16px; padding:16px 0; border-bottom:1px solid var(--line); }
  .tier-row:last-child{ border-bottom:none; }
  .tier-num{ font-family:var(--mono); font-size:20px; color:var(--accent-signal); font-weight:600; flex-shrink:0; width:32px; }
  .tier-body h4{ font-size:14.5px; margin:0 0 6px; }
  .tier-body p{ font-size:13px; color:var(--text-muted); line-height:1.6; margin:0; }

  .news-filters{ display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
  .filter-pill{
    font-family:var(--mono); font-size:11px; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--text-muted); background:var(--surface-raised); border:1px solid var(--line);
    padding:7px 14px; cursor:pointer; transition:all .15s ease;
  }
  .filter-pill:hover{ border-color:var(--accent-signal); color:var(--accent-signal); }
  .filter-pill.active{ border-color:var(--accent-signal); color:var(--accent-signal); }
  .news-grid{ display:flex; flex-direction:column; gap:1px; background:var(--line); }
  .news-card{ background:var(--surface); padding:20px 22px; }
  .news-meta{ display:flex; gap:10px; align-items:center; margin-bottom:8px; font-family:var(--mono); font-size:10.5px; color:var(--text-muted); letter-spacing:0.04em; text-transform:uppercase; }
  .news-cat{ padding:2px 8px; border:1px solid var(--line); }
  .news-card h4{ font-size:15px; margin:0 0 8px; }
  .news-card p{ font-size:13.5px; color:var(--text-muted); line-height:1.65; margin:0 0 8px; }
  .news-source{ font-size:11.5px; color:var(--text-muted); font-style:italic; }
  .news-freshness{ font-size:12px; color:var(--text-muted); margin-bottom:20px; padding:10px 14px; border:1px dashed var(--line); }

  /* --- icons --- */
  .icon-badge{
    width:40px; height:40px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--text-muted);
    transition:color .2s ease, border-color .2s ease, background .2s ease;
  }

  /* --- accordion cards (runbooks / foundational docs) --- */
  .acc-card{ border:1px solid var(--line); background:var(--surface-raised); margin-bottom:10px; }
  .acc-head{ display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer; transition:background .15s ease; }
  .acc-head:hover{ background:var(--surface); }
  .acc-head:hover .icon-badge{ background:var(--accent-signal); border-color:var(--accent-signal); color:var(--text-on-accent); }
  .acc-head:hover h4{ color:var(--accent-signal); }
  .acc-head h4{ font-size:14.5px; margin:0; transition:color .15s ease; }
  .acc-head .acc-sub{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .acc-chevron{ margin-left:auto; font-family:var(--mono); color:var(--text-muted); transition:transform .2s ease; flex-shrink:0; }
  .acc-card.open .acc-chevron{ transform:rotate(90deg); }
  .acc-body{ display:none; padding:0 18px 18px 74px; }
  .acc-card.open .acc-body{ display:block; }
  .acc-body ol{ margin:0; padding-left:18px; }
  .acc-body li{ font-size:13.5px; color:var(--text-muted); line-height:1.65; margin-bottom:10px; }
  .acc-body ul{ margin:0; padding-left:18px; }
  .acc-body ul li{ margin-bottom:10px; }

  /* --- roadmap --- */
  .stage-band{ display:flex; align-items:center; gap:12px; margin:0 0 4px; padding:12px 16px; border-left:3px solid var(--stage-color, var(--accent-signal)); background:var(--surface-raised); }

  .stage-band .stage-label{ font-family:var(--mono); font-size:13px; font-weight:600; color:var(--stage-color, var(--accent-signal)); }
  .stage-band .stage-range{ font-family:var(--mono); font-size:11px; color:var(--text-muted); }
  .stage-band p{ font-size:12.5px; color:var(--text-muted); margin:0; flex:1; }
  @media (max-width:640px){ .stage-band{ flex-direction:column; align-items:flex-start; gap:4px; } }
  .phase-row{ display:flex; gap:16px; padding:16px 0 16px 16px; border-bottom:1px solid var(--line); position:relative; }
  .phase-row:last-child{ border-bottom:none; }
  .phase-row::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--phase-color, var(--line)); }
  .phase-num{ font-family:var(--mono); font-size:22px; font-weight:600; color:var(--phase-color, var(--accent-signal)); flex-shrink:0; width:34px; }
  .phase-row h4{ font-size:14.5px; margin:0 0 6px; }
  .phase-row p{ font-size:13px; color:var(--text-muted); line-height:1.6; margin:0; }
  .roadmap-loop{ margin-top:28px; padding:16px 18px; border:1px dashed var(--line); font-size:13px; color:var(--text-muted); display:flex; gap:12px; align-items:center; }
  .roadmap-loop svg{ flex-shrink:0; animation:spin 6s linear infinite; }
  @keyframes spin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }

  /* --- animated document lifecycle diagram --- */
  .lifecycle-wrap{ display:flex; justify-content:center; margin:24px 0 32px; }
  .lifecycle-node-label{ font-family:var(--mono); font-size:10px; fill:var(--text-muted); text-transform:uppercase; letter-spacing:0.03em; }

  /* --- learning resources (News tab) --- */
  .resource-groups{ display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:20px; }
  @media (max-width:720px){ .resource-groups{ grid-template-columns:1fr; } }
  .resource-group h4{ font-family:var(--mono); font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent-signal); margin:0 0 12px; }
  .resource-item{ margin-bottom:14px; }
  .resource-item b{ display:block; font-size:13.5px; margin-bottom:3px; }
  .resource-item span{ font-size:12.5px; color:var(--text-muted); line-height:1.55; }

  /* --- home hero: infinity loop + live percentage counter --- */
  .hero-banner{
    display:flex; align-items:center; gap:36px; flex-wrap:wrap;
    min-height:25vh;
    padding:36px;
    border:1px solid var(--line);
    background-color:var(--tile-bg);
    background-image:var(--hero-wallpaper);
    background-size:cover;
    background-position:center;
    position:relative;
    overflow:hidden;
  }
  .hero-banner::before{
    content:'';
    position:absolute; inset:0;
    background:var(--hero-scrim);
    pointer-events:none;
  }
  .hero-banner-inner{ position:relative; z-index:1; flex:1; min-width:260px; }
  .hero-banner .hero-infinity{ position:relative; z-index:1; }
  /* Wallpaper only renders in dark mode, so light text applies there only */
  html:not([data-theme="light"]) .hero-banner .page-title{ color:#FFFFFF; }
  html:not([data-theme="light"]) .hero-banner .page-lede{ color:rgba(255,255,255,0.82); }
  @media (max-width:760px){ .hero-banner{ flex-direction:column; min-height:auto; } }
  .hero-infinity{ position:relative; flex-shrink:0; width:330px; max-width:100%; }
  .hero-infinity svg{ width:100%; height:auto; display:block; }

<script>
const FUNCTIONS = ["Govern","Identify","Protect","Detect","Respond","Recover"];
const FUNC_COLORS = {
  "Govern":"#B48EC7", "Identify":"#E0A94A", "Protect":"var(--accent-signal)", "Detect":"#6FA8DC", "Respond":"#D6685F", "Recover":"#3FC7C0"
};

const STEPS = [
  {
    fn:"Govern",
    ref:"NIST CSF · GV.PO / GV.RR / GV.SC",
    title:"Govern",
    sub:"The mandate and oversight that make everything else more than good intentions.",
    questions:[
      { id:"govPolicy", text:"Is there a documented cybersecurity policy, approved by leadership?",
        options:[
          {v:0, t:"No"},
          {v:1, t:"Yes, but outdated or unreviewed"},
          {v:2, t:"Yes, current and formally approved"},
        ]},
      { id:"govRoles", text:"Are cybersecurity roles and responsibilities formally assigned?",
        options:[
          {v:0, t:"No - \"IT handles it\", informally"},
          {v:1, t:"Somewhat, but not documented"},
          {v:2, t:"Yes, clearly documented"},
        ]},
      { id:"govReporting", text:"Does leadership receive regular reporting on cybersecurity risk?",
        options:[ {v:0,t:"Never"}, {v:1,t:"Ad hoc, when something goes wrong"}, {v:2,t:"Yes, on a regular schedule"} ]},
      { id:"govRiskDecisions", text:"Is cybersecurity risk factored into business decisions (new vendors, new products) before they're approved?",
        options:[ {v:0,t:"No"}, {v:1,t:"Sometimes, informally"}, {v:2,t:"Yes, a formal process"} ]},
      { id:"isoIsms", framework:"iso27001", text:"Do you maintain a formal Information Security Management System (ISMS) with a defined scope and periodic management review?",
        options:[ {v:0,t:"No"}, {v:1,t:"Informally"}, {v:2,t:"Yes, formally documented"} ]},
      { id:"nis2Training", framework:"nis2", text:"Has your management body received specific training on cybersecurity risk oversight, as NIS2 requires of accountable executives?",
        options:[ {v:0,t:"No"}, {v:1,t:"Not formally"}, {v:2,t:"Yes"} ]},
    ]
  },
  {
    fn:"Identify",
    ref:"NIST CSF · ID.AM / ID.RA",
    title:"Identify",
    sub:"What you have, and what depends on it.",
    questions:[
      { id:"assetInv", text:"How would you describe your asset inventory?",
        options:[
          {v:0, t:"No formal inventory - tribal knowledge"},
          {v:1, t:"Partial, manually maintained spreadsheet"},
          {v:2, t:"Automated and continuously updated"},
        ]},
      { id:"dataClass", text:"Do you classify data by sensitivity (public / internal / confidential / restricted)?",
        options:[ {v:0,t:"No"}, {v:2,t:"Yes"} ]},
      { id:"vendorCount", text:"How many third-party vendors have access to your systems or data?",
        options:[
          {v:2, t:"None"},
          {v:1, t:"1–5, informally tracked"},
          {v:0, t:"6+, and not formally reviewed"},
        ]},
      { id:"isoRiskAssess", framework:"iso27001", text:"Do you conduct a formal asset-based risk assessment at least annually?",
        options:[ {v:0,t:"No"}, {v:1,t:"Ad hoc, not annual"}, {v:2,t:"Yes, at least annually"} ]},
    ]
  },
  {
    fn:"Protect",
    ref:"NIST CSF · PR.AC / PR.DS",
    title:"Protect",
    sub:"The safeguards standing between an attacker and your systems.",
    questions:[
      { id:"mfa", text:"Is multi-factor authentication enforced for remote and admin access?",
        options:[ {v:0,t:"No"}, {v:1,t:"Admin accounts only"}, {v:2,t:"Yes, everywhere"} ]},
      { id:"patching", text:"How are software patches and updates managed?",
        options:[ {v:0,t:"Ad hoc / manual"}, {v:1,t:"Scheduled but inconsistent"}, {v:2,t:"Automated, with an SLA"} ]},
      { id:"training", text:"Do employees receive security awareness training?",
        options:[ {v:0,t:"Never"}, {v:1,t:"Once, at onboarding"}, {v:2,t:"Ongoing, recurring"} ]},
      { id:"endpoint", text:"Is endpoint protection (EDR/antivirus) deployed on all devices?",
        options:[ {v:0,t:"No"}, {v:1,t:"Partial coverage"}, {v:2,t:"Yes, all devices"} ]},
      { id:"rdpExposed", text:"Is RDP or another remote-admin protocol reachable directly from the internet (not behind a VPN/ZTNA)?",
        options:[ {v:0,t:"Yes"}, {v:2,t:"No - behind VPN/ZTNA only"} ]},
      { id:"emailAuth", text:"Is email authentication (SPF, DKIM, and DMARC set to quarantine/reject) enforced for your domain?",
        options:[ {v:0,t:"No / not sure"}, {v:1,t:"Partially - e.g. DMARC set to \"none\""}, {v:2,t:"Yes, fully enforced"} ]},
      { id:"privSeparation", text:"Are administrative accounts kept separate from everyday user accounts?",
        options:[ {v:0,t:"No - same account used for both"}, {v:1,t:"Partially"}, {v:2,t:"Yes, fully separated"} ]},
      { id:"offboarding", text:"Is there a formal process to revoke all access immediately when someone leaves or changes roles?",
        options:[ {v:0,t:"No"}, {v:1,t:"Informal / inconsistent"}, {v:2,t:"Yes, formal and immediate"} ]},
      { id:"soc2Change", framework:"soc2", text:"Do you have documented change management controls for production systems?",
        options:[ {v:0,t:"No"}, {v:1,t:"Informal"}, {v:2,t:"Yes, documented and enforced"} ]},
    ]
  },
  {
    fn:"Detect",
    ref:"NIST CSF · DE.CM",
    title:"Detect",

function matchedVendorNotes(){
  const haystack = [answers.edgeDeviceVendor, answers.sdwanVendor, answers.edrVendor, answers.hostingProvider, answers.webServerStack, answers.dlpVendor, answers.cloudProvider]
    .filter(Boolean).join(' ').toLowerCase();
  if(!haystack) return [];
  const seen = new Set();
  const matches = [];
  VENDOR_NOTES.forEach(v=>{
    if(v.keywords.some(k => haystack.includes(k)) && !seen.has(v.vendor)){
      seen.add(v.vendor);
      matches.push(v);
    }
  });
  return matches;
}

function visibleQuestions(step){
  return step.questions.filter(q => !q.framework || scope[q.framework]);
}

function fieldVisible(f){
  return !f.conditional || f.conditional();
}

function preVisible(idx){
  const step = PRE_STEPS[idx];
  return !step.skipIf || !step.skipIf();
}
function firstVisiblePreIndex(){
  let i = 0; while(i < PRE_STEPS.length && !preVisible(i)) i++;
  return i;
}
function lastVisiblePreIndex(){
  let i = PRE_STEPS.length-1; while(i >= 0 && !preVisible(i)) i--;
  return i;
}
function nextVisiblePreIndex(from){
  let i = from+1; while(i < PRE_STEPS.length && !preVisible(i)) i++;
  return i;
}
function prevVisiblePreIndex(from){
  let i = from-1; while(i >= 0 && !preVisible(i)) i--;
  return i;
}

function preStepComplete(stepDef){
  return stepDef.fields.filter(fieldVisible).every(f => !f.required || (answers[f.id] !== undefined && answers[f.id] !== ''));
}

function renderFieldHtml(f){
  if(!fieldVisible(f)) return '';
  if(f.type === 'info'){
    return `<div class="info-box">${f.label}</div>`;
  }
  const val = answers[f.id] ?? '';
  if(f.type === 'select'){
    return `
      <div class="field">
        <label>${f.label}${f.required?'':' <span class="opt-tag">optional</span>'}</label>
        <select data-fid="${f.id}">
          <option value="" ${val===''?'selected':''} disabled>Select…</option>
          ${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>`;
  }
  return `
    <div class="field">
      <label>${f.label}${f.required?'':' <span class="opt-tag">optional</span>'}</label>
      <input type="text" data-fid="${f.id}" value="${val}" placeholder="${f.placeholder||''}">
    </div>`;
}

function renderPre(){
  const stepDef = PRE_STEPS[preIndex];
  const panel = document.getElementById('panel');
  const isLastVisible = nextVisiblePreIndex(preIndex) >= PRE_STEPS.length;
  panel.innerHTML = `
    <div class="step-eyebrow">Pre-Assessment</div>
    <h2 class="step-title">${stepDef.title}</h2>
    <p class="step-sub">${stepDef.sub}</p>
    ${stepDef.fields.map(renderFieldHtml).join('')}
    <div class="nav">
      <button id="backBtn">← Back</button>
      <button id="saveProgressBtn">Save progress ↓</button>
      <button class="primary" id="nextBtn" disabled>${isLastVisible ? 'Continue to assessment →' : 'Continue →'}</button>
    </div>
  `;

  document.getElementById('saveProgressBtn').addEventListener('click', ()=> exportProgressJson(null));

  function refreshNext(){
    document.getElementById('nextBtn').disabled = !preStepComplete(stepDef);
  }

  panel.querySelectorAll('select[data-fid]').forEach(el=>{
    el.addEventListener('change', ()=>{
      answers[el.dataset.fid] = el.value;
      renderPre();
    });
  });
  panel.querySelectorAll('input[data-fid]').forEach(el=>{
    el.addEventListener('input', ()=>{
      answers[el.dataset.fid] = el.value;
      refreshNext();
    });
  });

  refreshNext();

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    const nxt = nextVisiblePreIndex(preIndex);
    if(nxt >= PRE_STEPS.length){ phase='wizard'; current=0; renderRail(); renderStep(); }
    else { preIndex = nxt; renderRail(); renderPre(); }
  });
  document.getElementById('backBtn').addEventListener('click', ()=>{
    const prv = prevVisiblePreIndex(preIndex);
    if(prv < 0){ phase='scope'; renderRail(); renderScope(); }
    else { preIndex = prv; renderRail(); renderPre(); }
  });
}

function observeReveals(){
  const els = document.querySelectorAll('.section-tile, .page-intro');
  if(!('IntersectionObserver' in window)){
    els.forEach(el=>el.classList.add('revealed'));
    return;
  }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('revealed');
        io.unobserve(entry.target);
      }
    });
  }, { threshold:0.06, rootMargin:'0px 0px -40px 0px' });
  els.forEach(el=> io.observe(el));
}

    if(dd){
      const parentActive = activeTab===t.id || dd.some(d=>d.id===activeTab);
      return `
        <div class="tab-item has-dropdown">
          <button class="tab-btn ${parentActive?'active':''}" data-tab="${t.id}">${t.label} <span class="tab-caret" data-toggle="1">▾</span></button>
          <div class="tab-dropdown">
            ${dd.map(d=>`<button class="dropdown-link ${activeTab===d.id?'active':''}" data-tab="${d.id}">${d.label}</button>`).join('')}
          </div>
        </div>
      `;
    }
    return `<button class="tab-btn ${activeTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`;
  }).join('');

  nav.innerHTML = navHtml;

  nav.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeTab = btn.dataset.tab;
      renderApp();
    });
  });
  nav.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      e.preventDefault();
      const item = el.closest('.tab-item');
      const wasOpen = item.classList.contains('open');
      nav.querySelectorAll('.tab-item.open').forEach(i=>i.classList.remove('open'));
      if(!wasOpen) item.classList.add('open');
    });
  });
  if(!window._tabnavOutsideClickBound){
    document.addEventListener('click', (e)=>{
      if(!e.target.closest('.tab-item')){
        document.querySelectorAll('.tab-item.open').forEach(i=>i.classList.remove('open'));
      }
    });
    window._tabnavOutsideClickBound = true;
  }
  if(!window._footerLinksBound){
    document.querySelectorAll('.footer-links a[data-tab]').forEach(a=>{
      a.addEventListener('click', (e)=>{
        e.preventDefault();
        goToTab(a.dataset.tab);
        window.scrollTo({ top:0, behavior:'smooth' });
      });
    });
    const brandLink = document.getElementById('brandHomeLink');
    if(brandLink){
      brandLink.addEventListener('click', (e)=>{
        e.preventDefault();
        goToTab('home');
      });
    }
    window._footerLinksBound = true;
  }
}

function buildHeroInfinity(){
  // Lemniscate of Gerono, re-parametrized to start at a crossing point so each
  // half of the array is one clean, contiguous loop (not split across the array boundary).
  const a = 82, n = 90, cx = 130, cy = 68;
  const pts = [];
  for(let i=0;i<=n;i++){
    const t = Math.PI/2 + (i/n) * 2 * Math.PI;
    const denom = 1 + Math.sin(t)*Math.sin(t);
    pts.push([cx + a*Math.cos(t)/denom, cy + a*Math.sin(t)*Math.cos(t)/denom]);
  }
  const toPath = arr => 'M' + arr.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' L');
  const d = toPath(pts) + ' Z';
  const half = Math.round(n/2);
  const discoveryLoop = toPath(pts.slice(0, half+1));   // left loop
  const optimizeLoop = toPath(pts.slice(half, n+1));    // right loop
  return `
  <div class="hero-infinity">
    <svg viewBox="0 0 ${cx*2} ${cy*2}" xmlns="http://www.w3.org/2000/svg">
      <path d="${d}" fill="none" stroke="var(--line)" stroke-width="7"/>
      <path d="${discoveryLoop}" fill="none" stroke="var(--accent-signal)" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
      <path d="${optimizeLoop}" fill="none" stroke="var(--accent-violet)" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
      <path d="${d}" fill="none" stroke="var(--accent-signal)" stroke-width="7" stroke-linecap="round" class="infinity-flow"/>
    </svg>
    <div class="infinity-caption">
      <span style="color:var(--accent-signal)">Discovery</span>
      <span style="color:var(--accent-secure)">Transform</span>
      <span style="color:var(--accent-violet)">Optimization</span>
    </div>
  </div>`;
}

    return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a), label:s };
  });
  const pathD = `M ${cx+r},${cy} A ${r},${r} 0 1,1 ${cx-r+0.01},${cy} A ${r},${r} 0 1,1 ${cx+r},${cy}`;
  return `
  <svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg">
    <path id="lifecyclePath" d="${pathD}" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="var(--surface)" stroke="var(--accent-secure)" stroke-width="1.6"/>`).join('')}
    ${pts.map(p=>{
      const labelY = p.y + (p.y > cy ? 22 : (p.y < cy - 5 ? -14 : 5));
      const anchor = p.x > cx+30 ? 'start' : p.x < cx-30 ? 'end' : 'middle';
      return `<text x="${p.x.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="${anchor}" class="lifecycle-node-label">${p.label}</text>`;
    }).join('')}
    <circle r="6" fill="var(--accent-signal)">
      <animateMotion dur="9s" repeatCount="indefinite">
        <mpath href="#lifecyclePath"/>
      </animateMotion>
    </circle>
    <text x="200" y="175" text-anchor="middle" class="lifecycle-node-label" style="font-size:11px; letter-spacing:0.05em;">continuous, not one-and-done</text>
  </svg>`;
}

    const file = e.target.files[0];
    if(!file) return;
    const resultEl = document.getElementById('uploadResult');

    if(ext === 'json'){
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try {
          const data = JSON.parse(ev.target.result);
          if(!data.scsExport) throw new Error('not-recognized');
          Object.keys(scope).forEach(k=>delete scope[k]);
          Object.assign(scope, data.scope || {});
          Object.keys(answers).forEach(k=>delete answers[k]);
          Object.assign(answers, data.answers || {});
          const industryLabel = (INDUSTRIES.find(i=>i.id===data.scope?.industry)||{}).label || 'Not set';
          const scoreLine = (data.overall === null || data.overall === undefined) ? 'In progress - not yet completed' : `${data.overall}% overall`;
          resultEl.className = 'upload-result';
          resultEl.innerHTML = `
            <b>Report loaded</b> - ${file.name}<br>

            Exported: ${data.exportedAt ? new Date(data.exportedAt).toLocaleString() : 'unknown'}<br><br>

          `;
          const goBtn = document.createElement('button');
          goBtn.className = 'cta-btn';
          goBtn.style.marginTop = '14px';
          goBtn.textContent = 'Review & re-run assessment →';
          goBtn.addEventListener('click', ()=>{ phase = 'scope'; goToTab('assessment'); });
          resultEl.appendChild(goBtn);
        } catch(err){
          resultEl.className = 'upload-result error';
          resultEl.innerHTML = `<b>Couldn't read this file</b> - it doesn't look like a SimplifiedCS export. Try exporting one from a completed assessment's results screen first (look for "Export as JSON").`;
        }
      };
      reader.readAsText(file);
    } else {
      resultEl.className = 'upload-result';
      resultEl.innerHTML = `
        <b>File received</b> - ${file.name}<br>
        This prototype only fully parses its own JSON export format. In the live version, this is exactly where Claude's document understanding would extract structured findings from any report format (PDF, Word, whatever your last audit came in) and pre-populate the assessment automatically - that integration isn't built here yet.
      `;
    }
  });
}

        <div class="icon-badge">${icon('urgent')}</div>
        <div>
          <h4>${p.title} <span class="q-badge">${p.cat}</span></h4>
          <div class="acc-sub">${p.ref} · ${p.mitre}</div>
        </div>
        <div class="acc-chevron">▸</div>
      </div>
      <div class="acc-body">
        <p class="body-text" style="margin-bottom:12px;">${p.desc}</p>

}

    <div class="page">

        <div class="page-eyebrow">Learn From What Already Happened</div>
        <h2 class="page-title">Case Studies</h2>

      <div class="section-tile">

function renderRail(){
  const rail = document.getElementById('rail');
  const visiblePre = PRE_STEPS.filter(s => !s.skipIf || !s.skipIf());
  const items = ['Scope', ...visiblePre.map(s=>s.fn), ...STEPS.map(s=>s.fn), 'Reading'];
  let activeIdx;
  if(phase==='scope') activeIdx = 0;
  else if(phase==='pre'){
    const posInVisible = visiblePre.indexOf(PRE_STEPS[preIndex]);
    activeIdx = 1 + (posInVisible >= 0 ? posInVisible : 0);
  }
  else if(phase==='wizard') activeIdx = 1 + visiblePre.length + current;
  else activeIdx = items.length - 1;
  rail.innerHTML = '<div class="rail-line"></div>' + items.map((label,i)=>{
    let cls = 'node';
    if(i < activeIdx) cls += ' done';
    if(i === activeIdx) cls += ' active';
    return `<div class="${cls}"><div class="dot"></div><div class="label">${label}</div></div>`;
  }).join('');
}

function allAnswered(step){
  return visibleQuestions(step).every(q => answers[q.id] !== undefined);
}

function renderStep(){
  const step = STEPS[current];
  const panel = document.getElementById('panel');
  const qs = visibleQuestions(step);
  panel.innerHTML = `
    <div class="step-eyebrow">${step.ref}</div>
    <h2 class="step-title">${step.title}</h2>
    <p class="step-sub">${step.sub}</p>
    ${qs.map(q => `
      <div class="question">
        <p>${q.text}${q.framework ? `<span class="q-badge">${FRAMEWORKS.find(f=>f.id===q.framework).name}</span>` : ''}</p>
        <div class="options">
          ${q.options.map(o => `
            <div class="option ${answers[q.id]===o.v ? 'selected':''}" data-qid="${q.id}" data-val="${o.v}">
              <div class="radio"></div><div>${o.t}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('')}
    <div class="nav">
      <button id="backBtn">← Back</button>
      <button id="saveProgressBtn2">Save progress ↓</button>
      <button class="primary" id="nextBtn" disabled>${current===STEPS.length-1 ? 'Generate reading' : 'Continue →'}</button>
    </div>
  `;

  document.getElementById('saveProgressBtn2').addEventListener('click', ()=> exportProgressJson(null));

  panel.querySelectorAll('.option').forEach(el=>{
    el.addEventListener('click', ()=>{
      const qid = el.dataset.qid;
      answers[qid] = Number(el.dataset.val);
      renderStep();
    });
  });

  document.getElementById('nextBtn').disabled = !allAnswered(step);
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(current === STEPS.length-1){ current++; phase='results'; renderRail(); renderResults(); }
    else { current++; renderRail(); renderStep(); }
  });
  document.getElementById('backBtn').addEventListener('click', ()=>{
    if(current>0){ current--; renderRail(); renderStep(); }
    else {
      const idx = lastVisiblePreIndex();
      if(idx < 0){ phase='scope'; renderRail(); renderScope(); }
      else { phase='pre'; preIndex = idx; renderRail(); renderPre(); }
    }
  });
}

function scoreFunction(step){
  const qs = visibleQuestions(step);
  const max = qs.length * 2;
  const got = qs.reduce((sum,q)=> sum + (answers[q.id] ?? 0), 0);
  return Math.round((got/max)*100);
}

function computeFlags(){
  const flags = [];
  if(answers.mfa === 0 && answers.vendorCount === 0){
    flags.push("No MFA combined with 6+ unreviewed third-party vendors means any single leaked vendor credential grants direct, unmonitored access - this is a materially higher-risk combination than either gap alone.");
  }
  if(answers.siem === 0 && answers.irPlan !== 2){
    flags.push("No centralized logging paired with an untested (or absent) incident response plan means a breach would likely be discovered late, by someone else, with no rehearsed process to contain it.");
  }
  if(answers.backupTest === 0 && answers.endpoint !== 2){
    flags.push("Untested backups combined with incomplete endpoint protection is the specific combination that turns a routine ransomware infection into an unrecoverable one.");
  }
  if(answers.training === 0 && answers.mfa !== 2){
    flags.push("No security awareness training alongside partial MFA coverage means phishing is both more likely to succeed and more likely to reach an unprotected account.");
  }
  if(answers.govRiskDecisions === 0 && answers.vendorCount === 0){
    flags.push("Cybersecurity risk isn't factored into vendor decisions, and you already have 6+ vendors that were never formally reviewed - this is exactly how supply-chain risk enters unnoticed rather than through a single dramatic failure.");
  }
  if(answers.govPolicy === 0 && answers.irPlan !== 2){
    flags.push("No leadership-approved security policy alongside no tested incident response plan means there's no top-down mandate driving readiness - response capability depends on individual initiative rather than an accountable program.");
  }
  if(answers.externalWebsite === "Yes" && answers.webDb === "Yes" && (answers.siem === 0 || answers.exfil === 0)){
    flags.push("A public-facing web app that connects to a backend database, without centralized logging or outbound-traffic monitoring, is precisely the setup where a SQL injection or similar attack goes unnoticed long enough to exfiltrate the entire database.");
  }
  if(answers.itSecStaff === "0 - no dedicated staff" && answers.secManagedBy === "No formal management"){
    flags.push("No dedicated in-house staff and no formal MSP/MDR arrangement means, in practice, no one is accountable for noticing or acting on any of the findings in this report.");
  }
  if((answers.deployModel === "Cloud-only" || answers.deployModel === "Hybrid (on-prem + cloud)") && answers.mfa === 0){
    flags.push("Cloud or hybrid infrastructure without MFA enforced is a materially larger exposure than the same gap on a purely on-premises setup - cloud admin consoles are reachable from anywhere a leaked password reaches.");
  }
  if(answers.rdpExposed === 0 && (answers.backupTest === 0 || answers.endpoint !== 2)){
    flags.push("Remote admin access reachable directly from the internet is, on its own, one of the most common real-world ransomware entry points. Paired with the backup or endpoint gaps flagged elsewhere here, it meaningfully raises the odds of a successful, damaging intrusion - this exact combination appears repeatedly in ransomware case studies.");
  }
  if(answers.emailAuth === 0 && answers.training === 0){
    flags.push("No enforced email authentication (SPF/DKIM/DMARC) combined with no security awareness training means phishing and business email compromise attempts are both more likely to arrive successfully and more likely to fool the person who receives them.");
  }
  if(answers.hasOT === "Yes" && answers.otSegregation === "No - flat/shared network"){
    flags.push("An OT/ICS environment sharing a flat network with corporate IT means a routine IT compromise (phishing, ransomware) can pivot directly into industrial control systems - this is one of the most consequential architecture gaps an OT environment can have.");
  }
  if(answers.hasOT === "Yes" && answers.otRemoteAccess === "Yes, but not via a dedicated secure gateway"){
    flags.push("Remote access into OT systems without a dedicated, monitored gateway is a direct path from any compromised remote user's device straight into industrial control systems.");
  }
  if(answers.developsSoftware === "Yes" && answers.devsecopsMaturity === "No formal practice - security reviewed late, if at all" && answers.secretsManagement === "Hardcoded or stored in plain config files"){
    flags.push("No security gates in the software delivery pipeline, combined with hardcoded secrets in code or config files, is one of the most common ways credentials end up leaked in a public repository or a compromised build artifact.");
  }
  if(answers.containerUse && answers.containerUse !== "No" && answers.imageRegistry === "No"){
    flags.push("Running containerized workloads without scanning images for known vulnerabilities means you could be deploying publicly known, already-patched CVEs into production without realizing it.");
  }
  return flags;
}

function computeGapItems(){
  const items = [];
  STEPS.forEach(step=>{
    visibleQuestions(step).forEach(q=>{
      const val = answers[q.id];
      const maxOpt = Math.max(...q.options.map(o=>o.v));
      if(val < maxOpt){
        items.push({ fn:step.fn, gap: q.text, severity: maxOpt - val });
      }
    });
  });
  return items;
}

function computePriorities(){
  return computeGapItems().sort((a,b)=> b.severity - a.severity).slice(0,5);
}

function verdictLabel(pct){
  if(pct >= 80) return "Strong health";
  if(pct >= 55) return "Moderate exposure";
  if(pct >= 30) return "Elevated exposure";
  return "Critical exposure";
}

function snapshotRows(){
  const rows = [];
  rows.push(["Organization size", answers.employeeCount || '-']);
  rows.push(["Dedicated IT/security staff", answers.itSecStaff || '-']);
  let mgmt = answers.secManagedBy || '-';
  if(answers.mdrMspName) mgmt += ` (${answers.mdrMspName})`;
  rows.push(["Security managed by", mgmt]);
  rows.push(["EDR / antivirus", answers.edrVendor || 'Not specified']);
  let dlp = answers.dlpUsed || '-';
  if(answers.dlpVendor) dlp += ` - ${answers.dlpVendor}`;
  rows.push(["DLP solution", dlp]);
  let deploy = answers.deployModel || '-';
  if(answers.cloudProvider) deploy += ` - ${answers.cloudProvider}`;
  rows.push(["Deployment model", deploy]);
  rows.push(["Network architecture", answers.networkArch || '-']);
  let sdwan = answers.sdwanUsed || '-';
  if(answers.sdwanVendor) sdwan += ` - ${answers.sdwanVendor}`;
  rows.push(["SD-WAN", sdwan]);
  rows.push(["External-facing devices", answers.externalDevices || '-']);
  if(answers.edgeDeviceVendor) rows.push(["Firewall / VPN appliance", answers.edgeDeviceVendor]);
  let webExp = answers.externalWebsite || '-';
  if(answers.webDb) webExp += `, DB-connected: ${answers.webDb}`;
  rows.push(["External-facing web app", webExp]);
  let hosting = answers.hostingProvider || 'Not specified';
  if(answers.webServerStack) hosting += ` - ${answers.webServerStack}`;
  rows.push(["Hosting / web stack", hosting]);
  if(answers.developsSoftware){
    rows.push(["Develops custom software", answers.developsSoftware]);
    if(answers.developsSoftware === "Yes"){
      if(answers.containerUse) rows.push(["Containerization", answers.containerUse]);
      if(answers.virtualization) rows.push(["Virtualization", answers.virtualization]);
      if(answers.devsecopsMaturity) rows.push(["DevSecOps maturity", answers.devsecopsMaturity]);
      if(answers.secretsManagement) rows.push(["Secrets management", answers.secretsManagement]);
    }
  }
  if(answers.hasOT){
    let ot = answers.hasOT;
    if(answers.hasOT === "Yes" && answers.otSegregation) ot += ` - segregation: ${answers.otSegregation}`;
    rows.push(["OT / ICS environment", ot]);
    if(answers.otVendor) rows.push(["ICS/SCADA platform", answers.otVendor]);
  }
  return rows;
}

async function renderResults(){
  const panel = document.getElementById('panel');
  panel.innerHTML = `<div class="step-eyebrow">Synthesis - all functions considered jointly</div><h2 class="step-title">Calculating your reading…</h2>`;

  const funcScores = STEPS.map(s=>({fn:s.fn, pct:scoreFunction(s)}));
  const overall = Math.round(funcScores.reduce((a,f)=>a+f.pct,0)/funcScores.length);
  const flags = computeFlags();
  const gapItems = computeGapItems();
  const priorities = [...gapItems].sort((a,b)=>b.severity-a.severity).slice(0,5);
  const vendorNotes = matchedVendorNotes();
  const currentGapTexts = gapItems.map(i=>i.gap);

  // Fetch prior runs (Claude artifact persistent storage - see prototype note below)
  let prevRun = null, historyCount = 0;
  try {
    const lr = await window.storage.list('runs:', false);
    if(lr && lr.keys && lr.keys.length){
      historyCount = lr.keys.length;
      const gets = await Promise.all(lr.keys.map(k => window.storage.get(k, false).catch(()=>null)));
      const runs = gets.filter(Boolean).map(g => JSON.parse(g.value)).sort((a,b)=> a.ts - b.ts);
      if(runs.length) prevRun = runs[runs.length-1];
    }
  } catch(e){ /* storage unavailable - proceed without history */ }

  let resolvedSincePrev = [], newSincePrev = [];
  if(prevRun && prevRun.gapTexts){
    resolvedSincePrev = prevRun.gapTexts.filter(g => !currentGapTexts.includes(g));
    newSincePrev = currentGapTexts.filter(g => !prevRun.gapTexts.includes(g));
  }

  // Save this run for next time
  const runRecord = { ts: Date.now(), overall, gapTexts: currentGapTexts, industry: scope.industry };
  try { await window.storage.set(`runs:${runRecord.ts}`, JSON.stringify(runRecord), false); } catch(e){ /* ignore save failure */ }

  const conic = (()=>{
    const slice = 360 / funcScores.length;
    let acc = 0;
    const parts = funcScores.map(f=>{
      const start = acc;
      acc += slice;
      return `${FUNC_COLORS[f.fn]} ${start}deg ${acc}deg`;
    });
    return `conic-gradient(${parts.join(',')})`;
  })();

  const delta = prevRun ? overall - prevRun.overall : null;

  panel.innerHTML = `
    <div class="step-eyebrow">Synthesis - all functions considered jointly</div>
    <h2 class="step-title">Health Reading</h2>
    <p class="step-sub">Assessed against: NIST CSF 2.0 + CIS Controls v8${FRAMEWORKS.filter(f=>scope[f.id]).map(f=>' + '+f.name).join('')}${scope.industry ? ' · ' + INDUSTRIES.find(i=>i.id===scope.industry).label : ''}</p>

    ${prevRun ? `
    <div class="delta-box">
      <h3>Change since your last assessment (${new Date(prevRun.ts).toLocaleDateString()})</h3>
      <div class="delta-score ${delta>=0?'up':'down'}">${delta>=0?'+':''}${delta}% overall</div>
      ${resolvedSincePrev.length ? `<div class="delta-resolved"><b>Resolved:</b> ${resolvedSincePrev.length} item(s) closed since last time</div>` : ''}
      ${newSincePrev.length ? `<div class="delta-new"><b>New:</b> ${newSincePrev.length} item(s) newly flagged</div>` : ''}
    </div>` : ''}

    <div class="snapshot">
      <h3>Infrastructure snapshot (self-reported)</h3>
      ${snapshotRows().map(([k,v])=>`<div class="snapshot-row"><div class="skey">${k}</div><div>${v}</div></div>`).join('')}
    </div>

    <div class="gauge-row">
      <div class="gauge" style="background:${conic}">
        <div class="gauge-inner">
          <div class="pct">${overall}%</div>
          <div class="verdict">${verdictLabel(overall)}</div>
        </div>
      </div>
      <div class="func-bars">
        ${funcScores.map(f=>`
          <div class="func-bar-row">
            <div class="fname">${f.fn}</div>
            <div class="func-bar-track"><div class="func-bar-fill" style="width:${f.pct}%; background:${FUNC_COLORS[f.fn]}"></div></div>
            <div class="fpct">${f.pct}%</div>
          </div>
        `).join('')}
      </div>
    </div>

    ${flags.length ? `
    <div class="flags">
      <h3>Compounding risk - patterns across steps</h3>
      ${flags.map(f=>`<div class="flag-item"><b>Combined finding -</b> ${f}</div>`).join('')}
    </div>` : ''}

    ${vendorNotes.length ? `
    <div class="flags">
      <h3>Vendor-specific mitigation notes</h3>
      ${vendorNotes.map(v=>`<div class="vendor-note-item"><b>${v.vendor} -</b> ${v.note}</div>`).join('')}
      <p class="scope-hint">Illustrative, based on well-documented historical exploitation patterns for named products - not a live feed. This tool intentionally doesn't do vulnerability scanning; treat this as a prompt to check current vendor advisories for your exact version, not a substitute for doing so.</p>
    </div>` : ''}

    <div class="priorities">
      <h3>Where to act first, ranked</h3>
      ${priorities.map((p,i)=>`
        <div class="priority-item">
          <div class="priority-rank">${String(i+1).padStart(2,'0')}</div>
          <div><b>${p.fn}:</b> ${p.gap}</div>
        </div>
      `).join('')}
    </div>

    <div class="note-box">
      <b>Prototype note -</b> the flags and priority list above are produced by a rules engine for this demo.
      In the live version, this panel is where the Claude API call plugs in: it receives the full answer set
      plus retrieved remediation content from the knowledge base, and writes the actual narrative report.
      The vendor/product fields in the snapshot above (EDR, SD-WAN, hosting/web stack) are exactly what a
      live vulnerability-lookup tool call would key off - checking public advisories/CVE feeds for those
      specific products - rather than anything fabricated here.
      <br><br>
      This run was just saved using Claude's artifact storage (private to your account) - that's what powers
      the history/delta view above. That storage is specific to this Claude environment; the production
      deployment needs a real database (e.g., Supabase) doing the same job.
    </div>

    <div class="nav">
      <button id="backBtn2">← Review answers</button>
      <button id="exportJsonBtn">Export as JSON ↓</button>
      <button id="viewHistoryBtn">View history (${historyCount+1}) →</button>
    </div>
  `;
  document.getElementById('backBtn2').addEventListener('click', ()=>{
    phase='wizard'; current = STEPS.length-1; renderRail(); renderStep();
  });
  document.getElementById('viewHistoryBtn').addEventListener('click', ()=>{
    goToTab('history');
  });
  document.getElementById('exportJsonBtn').addEventListener('click', ()=>{
    exportProgressJson(overall);
  });
}

function buildTrendSvg(runs){
  const w = 600, h = 120, pad = 20;
  const points = runs.map((r,i)=>{
    const x = pad + (runs.length===1 ? 0 : (i/(runs.length-1)) * (w-2*pad));
    const y = h - pad - (r.overall/100)*(h-2*pad);
    return [x,y];
  });
  const pathD = points.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = points.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--accent-secure)"/>`).join('');
  return `<svg class="trend-chart" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="1"/>
    <path d="${pathD}" fill="none" stroke="var(--accent-secure)" stroke-width="2"/>
    ${dots}
  </svg>`;
}

      runs = gets.filter(Boolean).map(g => JSON.parse(g.value)).sort((a,b)=> a.ts - b.ts);
    }
  } catch(e){ /* storage unavailable */ }

  panel.innerHTML = `
    <div class="page-intro">
      <div class="page-eyebrow">History</div>
      <h2 class="page-title">Assessment History</h2>
      <p class="page-lede">${runs.length} assessment${runs.length===1?'':'s'} saved on this account.</p>
    </div>
    <div class="section-tile">
      ${runs.length>=2 ? buildTrendSvg(runs) : ''}
      <div class="history-list">
        ${runs.length ? runs.slice().reverse().map(r=>`
          <div class="history-row">
            <div>${new Date(r.ts).toLocaleDateString()} ${new Date(r.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}${r.industry ? ' · ' + (INDUSTRIES.find(i=>i.id===r.industry)?.label || r.industry) : ''}</div>
            <div class="history-score">${r.overall}%</div>
          </div>
        `).join('') : '<p class="body-text">No assessments saved yet - complete one to start tracking.</p>'}
      </div>
      <div class="cta-row">
        <button class="cta-btn" id="backToScope">← Back to Assessment</button>
        ${runs.length ? `<button class="cta-btn secondary" id="clearHistory">Clear history</button>` : ''}
      </div>
    </div>
  `;
  document.getElementById('backToScope').addEventListener('click', ()=>{
    goToTab('assessment');
  });
  const clearBtn = document.getElementById('clearHistory');
  if(clearBtn){
    clearBtn.addEventListener('click', async ()=>{
      try {
        const lr = await window.storage.list('runs:', false);
        if(lr && lr.keys) await Promise.all(lr.keys.map(k=>window.storage.delete(k, false).catch(()=>null)));
      } catch(e){ /* ignore */ }
      renderHistory();
    });
  }
  observeReveals();
}

(async function init(){
  try {
    const r = await window.storage.get('theme', false);
    if(r && (r.value === 'light' || r.value === 'dark')) theme = r.value;
  } catch(e){ /* default to dark */ }
  document.documentElement.setAttribute('data-theme', theme);
  renderApp();
})();
